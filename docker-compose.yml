services:
  # The API owns the SQLite file; the named volume survives container recreation.
  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      DB_PATH: /data/app.db
      CORS_ORIGIN: http://localhost:3000
    volumes:
      - canvas-data:/data

  # Next.js serves the UI and proxies /api requests to the backend service network name.
  frontend:
    build:
      context: ./frontend
      args:
        API_PROXY_TARGET: http://backend:8080
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: /api
    depends_on:
      - backend

volumes:
  # Docker manages this volume separately from containers, preserving app.db.
  canvas-data:
